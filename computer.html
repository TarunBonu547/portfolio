<div class="computer-showcase">

    <div class="computer">

        <div class="computer-top">
            <span>DEV / SYSTEM</span>

            <div class="dots">
                <i></i>
                <i></i>
                <i></i>
            </div>
        </div>

        <div class="screen">

            <div class="scanlines"></div>

            <div class="abstract-lines">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="signal"></div>

            <div class="signal-point"></div>

            <div class="cursor"></div>

        </div>

    </div>

    <div class="computer-stand"></div>

</div>


<style>

.computer-showcase {

    width: 500px;

    position: relative;

    cursor: pointer;

    padding-bottom: 35px;
}


/* ===============================
   COMPUTER BODY
================================ */

.computer {

    width: 100%;

    height: 285px;

    padding: 17px;

    position: relative;

    background: #dedbd2;

    border: 1px solid rgba(17,17,17,.28);

    border-radius:
        26px 26px 22px 22px;

    box-shadow:
        inset 0 0 0 5px
        rgba(17,17,17,.025);

    transition:
        transform .55s
        cubic-bezier(.22,1,.36,1),

        box-shadow .55s ease;
}


/* subtle top curve */

.computer::before {

    content: "";

    position: absolute;

    left: 13%;
    right: 13%;

    top: 0;

    height: 3px;

    background:
        rgba(17,17,17,.08);

    border-radius:
        0 0 50% 50%;
}


/* hover */

.computer-showcase:hover .computer {

    transform:
        translateY(-8px)
        scale(1.015);

    box-shadow:
        0 22px 45px
        rgba(17,17,17,.12);
}


/* ===============================
   TOP BAR
================================ */

.computer-top {

    height: 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 5px;

    margin-bottom: 9px;

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 2px;

    color: #77736c;
}


.dots {

    display: flex;

    gap: 5px;
}


.dots i {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #77736c;

    opacity: .5;
}


/* ===============================
   SCREEN
================================ */

.screen {

    height: 214px;

    position: relative;

    overflow: hidden;

    background: #e8e5dc;

    border:
        1px solid
        rgba(17,17,17,.2);

    border-radius:
        18px 18px 15px 15px;

    box-shadow:
        inset 0 0 18px
        rgba(17,17,17,.045);

    transition:
        background .5s ease,

        box-shadow .5s ease;
}


/* inner screen frame */

.screen::before {

    content: "";

    position: absolute;

    inset: 10px;

    border:
        1px solid
        rgba(17,17,17,.07);

    border-radius:
        12px 12px 10px 10px;

    z-index: 10;

    pointer-events: none;
}


/* ===============================
   HOVER SCREEN
================================ */

.computer-showcase:hover .screen {

    background: #e4e5e1;

    box-shadow:
        inset 0 0 35px
        rgba(45,91,255,.055);
}


/* ===============================
   SCANLINES
================================ */

.scanlines {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 5px,
            rgba(17,17,17,.025) 6px
        );

    opacity: .5;

    pointer-events: none;
}


/* ===============================
   ABSTRACT LINES
================================ */

.abstract-lines {

    position: absolute;

    left: 30px;
    right: 30px;
    top: 35px;

    display: flex;

    flex-direction: column;

    gap: 12px;

    opacity: .08;

    transition:
        opacity .5s ease;
}


.computer-showcase:hover
.abstract-lines {

    opacity: .28;
}


.abstract-lines span {

    display: block;

    height: 4px;

    background: #111;

    transform:
        scaleX(0);

    transform-origin:
        left;

    width:
        var(--line-width);
}


/* different line lengths */

.abstract-lines span:nth-child(1) {
    --line-width: 28%;
}

.abstract-lines span:nth-child(2) {
    --line-width: 62%;
}

.abstract-lines span:nth-child(3) {
    --line-width: 45%;
}

.abstract-lines span:nth-child(4) {
    --line-width: 75%;
}

.abstract-lines span:nth-child(5) {
    --line-width: 38%;
}

.abstract-lines span:nth-child(6) {
    --line-width: 58%;
}

.abstract-lines span:nth-child(7) {
    --line-width: 31%;
}


/* animate lines */

.computer-showcase:hover
.abstract-lines span {

    animation:
        lineWrite
        1.8s
        cubic-bezier(.22,1,.36,1)
        infinite alternate;
}


.abstract-lines span:nth-child(2) {
    animation-delay: .12s;
}

.abstract-lines span:nth-child(3) {
    animation-delay: .24s;
}

.abstract-lines span:nth-child(4) {
    animation-delay: .36s;
}

.abstract-lines span:nth-child(5) {
    animation-delay: .48s;
}

.abstract-lines span:nth-child(6) {
    animation-delay: .60s;
}

.abstract-lines span:nth-child(7) {
    animation-delay: .72s;
}


@keyframes lineWrite {

    from {
        transform:
            scaleX(.12);
    }

    to {
        transform:
            scaleX(1);
    }
}


/* ===============================
   BLUE SIGNAL
================================ */

.signal {

    position: absolute;

    left: 28px;

    top: 50%;

    width: 0;

    height: 1px;

    background: #2d5bff;

    opacity: 0;

    transition:
        width .7s
        cubic-bezier(.22,1,.36,1),

        opacity .3s ease;
}


.computer-showcase:hover .signal {

    width:
        calc(100% - 56px);

    opacity: .8;
}


/* ===============================
   ORANGE POINT
================================ */

.signal-point {

    position: absolute;

    right: 28px;

    top:
        calc(50% - 3px);

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ff5b25;

    opacity: .3;

    transform:
        scale(.7);

    transition:
        opacity .3s ease,

        transform .4s
        cubic-bezier(.22,1,.36,1);
}


.computer-showcase:hover
.signal-point {

    opacity: 1;

    transform:
        scale(1.4);

    box-shadow:
        0 0 12px
        rgba(255,91,37,.4);
}


/* ===============================
   CURSOR
================================ */

.cursor {

    position: absolute;

    left: 30px;

    bottom: 27px;

    width: 7px;

    height: 12px;

    background: #111;

    opacity: .12;
}


.computer-showcase:hover .cursor {

    opacity: .75;

    animation:
        cursorMove
        2.5s
        ease-in-out
        infinite;
}


@keyframes cursorMove {

    0% {
        left: 30px;
    }

    40% {
        left: 48%;
    }

    70% {
        left: 65%;
    }

    100% {
        left: 78%;
    }
}


/* ===============================
   STAND
================================ */

.computer-stand {

    position: relative;

    width: 58%;

    height: 18px;

    margin:
        9px auto 0;

    background: #111;

    border-radius:
        0 0 14px 14px;
}


.computer-stand::before {

    content: "";

    position: absolute;

    left: 35%;

    top: 18px;

    width: 30%;

    height: 18px;

    background: #111;

    border-radius:
        0 0 7px 7px;
}


.computer-stand::after {

    content: "";

    position: absolute;

    left: 20%;

    top: 35px;

    width: 60%;

    height: 5px;

    background: #111;

    border-radius: 5px;
}


/* ===============================
   RESPONSIVE
================================ */

@media (max-width: 600px) {

    .computer-showcase {

        width: 100%;

    }

    .computer {

        height: 260px;

    }

    .screen {

        height: 188px;

    }

}

</style>
